add_newline = false

format = "$directory$git_branch$git_state$git_status$character"

[directory]
style = "bold cyan"
truncate_to_repo = true
truncation_length = 3
truncation_symbol = ""

[git_branch]
format = "[ $branch]($style) "
style = "bold magenta"

[git_state]
format = "[$state($progress_current/$progress_total)]($style) "
style = "bold yellow"

# Each symbol is a plain word/glyph + a count, so nothing needs decoding.
[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "yellow"
conflicted = "conflict${count} "
untracked   = "?${count} "
modified    = "~${count} "
staged      = "+${count} "
renamed     = "»${count} "
deleted     = "-${count} "
stashed     = "stash${count} "
ahead       = "↑${count} "
behind      = "↓${count} "
diverged    = "↑${ahead_count}↓${behind_count} "
up_to_date  = ""


[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
