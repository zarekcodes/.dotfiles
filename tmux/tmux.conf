# Use fish (and its starship prompt) instead of the login shell (bash)
set -g default-shell /usr/bin/fish
set -g default-command /usr/bin/fish

# True color so the starship/theme colors match Ghostty
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"

# Status bar: Onenord (matches the Ghostty theme)
set -g status-style "bg=#3b4252,fg=#d8dee9"
set -g status-left " #[fg=#81a1c1,bold]#S#[default] "
set -g status-left-length 30
set -g status-right "#[fg=#8fbcbb]%H:%M #[fg=#7b88a1]%d %b "
set -g status-right-length 40

setw -g window-status-format " #I #W "
setw -g window-status-current-format " #I #W "
setw -g window-status-current-style "bg=#434c5e,fg=#eceff4,bold"
setw -g window-status-style "fg=#7b88a1"
setw -g window-status-activity-style "fg=#ebcb8b"

set -g pane-border-style "fg=#3b4252"
set -g pane-active-border-style "fg=#81a1c1"
set -g message-style "bg=#434c5e,fg=#eceff4"
set -g mode-style "bg=#434c5e,fg=#eceff4"
